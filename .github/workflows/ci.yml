name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          version = json.loads(Path('manifest.json').read_text())['version']
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Tag and manifest versions differ'
          PY
      - run: python3 scripts/package.py
        if: startsWith(github.ref, 'refs/tags/v')
      - name: Publish development prerelease
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/focuvia-*.zip dist/SHA256SUMS --verify-tag --prerelease --title "Focuvia $RELEASE_TAG — development preview" --notes-file RELEASE_NOTES.md
      - name: Sync existing release notes
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="v$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')"
          if gh release view "$release_tag" --json tagName > /dev/null; then
            gh release edit "$release_tag" --notes-file RELEASE_NOTES.md
          fi
